services:
  cysa-trainer:
    build: .
    container_name: cysa-trainer
    restart: unless-stopped
    ports:
      # Bind only to localhost -- Cloudflare Tunnel (cloudflared) or your reverse
      # proxy talks to this port; it's never exposed directly to the LAN/WAN.
      - "127.0.0.1:3477:3000"
    volumes:
      - cysa_db_data:/app/db-data
    environment:
      - NODE_ENV=production
      # Copyrighted books/PDFs/EPUBs and the derived flashcards live in the
      # self-hosted Supabase Storage bucket, NOT in the image or the public repo.
      # Leave these unset to fall back to a local ./materials directory (dev).
      # Values come from the gitignored .env next to this file.
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_MATERIALS_BUCKET=${SUPABASE_MATERIALS_BUCKET:-cysa-materials}
      - SUPABASE_BOOKS_PREFIX=${SUPABASE_BOOKS_PREFIX:-books}
    # The Supabase gateway (envoy) is published on the host at :8000, so reach
    # it through the host gateway rather than joining the Supabase network.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cysa_db_data:
